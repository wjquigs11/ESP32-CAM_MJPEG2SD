[platformio]
default_envs = xiao-esp32s3-sense
src_dir = .
include_dir = .
workspace_dir = /var/tmp/cam

; Settings shared by all envs
[env]
; Arduino-ESP32 3.1.3 includes the PY260 / MEGA_CCM camera driver.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
build_src_filter =
    +<ESP32-CAM_MJPEG2SD.ino>
    +<ESP32-CAM_MJPEG2SD.ino.cpp>
    +<src/*.cpp>
monitor_speed = 115200

[env:m5stack-cams3-5mp]
board = esp32-s3-devkitc-1
; U174-B uses an ESP32-S3-WROOM-1-N16R8: QIO flash, octal PSRAM.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao-esp32s3-sense]
; Seeed XIAO ESP32S3 Sense: 8MB QIO flash, 8MB octal PSRAM, OV2640/OV3660,
; microSD on the Sense expansion board, PDM mic (CLK 42, DATA 41).
; The board def defines ARDUINO_XIAO_ESP32S3, which selects
; CAMERA_MODEL_XIAO_ESP32S3 in ESP32-CAM_MJPEG2SD.h.
; It also sets BOARD_HAS_PSRAM, USB CDC on boot and qio_opi memory.
board = seeed_xiao_esp32s3
; Local copy of the Arduino default_8MB.csv: the IDF hybrid build below only
; looks for partition tables in the project dir or IDF's partition_table dir.
board_build.partitions = partitions_xiao_8MB.csv
; Rebuild the Arduino IDF libs so the I2S driver allocates its channel objects
; in internal RAM. Stock libs put them in PSRAM, which GDMA rejects
; ("user context not in internal RAM"), so the PDM mic fails to start.
; The base sdkconfig used for the rebuild is 16MB flash / quad PSRAM, so the
; XIAO's 8MB flash and octal PSRAM (as in the stock qio_opi libs) are set here.
custom_sdkconfig =
    CONFIG_I2S_ISR_IRAM_SAFE=y
    CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
    '# CONFIG_ESPTOOLPY_FLASHSIZE_16MB is not set'
    CONFIG_ESPTOOLPY_FLASHSIZE="8MB"
    CONFIG_SPIRAM_MODE_OCT=y
    '# CONFIG_SPIRAM_MODE_QUAD is not set'
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
; Unused cloud components whose embedded server certs the hybrid build can't
; generate ("https_server.crt.S not found"), as in pioarduino's arduino-blink example.
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common
